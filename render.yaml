# Render Blueprint for TotalStock.
#
# Deploy from the Render Dashboard: New -> Blueprint -> select this repository.
# Render does not run docker-compose.yml; this file defines the equivalent
# services:
#   - totalstock-api: Django + Gunicorn Docker web service
#   - totalstock-web: React static site
#   - totalstock-db:  Render PostgreSQL
#
# If the generated *.onrender.com names differ (for example because a name is
# already taken), update CORS_ALLOWED_ORIGINS, CSRF_TRUSTED_ORIGINS and
# VITE_API_URL below to match.

services:
  - type: web
    name: totalstock-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health/
    initialDeployHook: python manage.py createsuperuser --noinput
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # ALLOWED_HOSTS is extended automatically from RENDER_EXTERNAL_HOSTNAME.
      - key: DJANGO_TIME_ZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: totalstock-db
          property: connectionString
      # Render's proxy and its free instances can outlive pooled connections.
      - key: DB_CONN_MAX_AGE
        value: "0"
      - key: CORS_ALLOWED_ORIGINS
        value: https://totalstock-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://totalstock-web.onrender.com,https://totalstock-api.onrender.com
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
      - key: ACCESS_TOKEN_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_THREADS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "60"
      # Used by initialDeployHook to create the first admin account. Render
      # prompts for the two secrets when the Blueprint is created.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_FULL_NAME
        value: TotalStock Admin

  - type: web
    name: totalstock-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_URL
        value: https://totalstock-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

databases:
  - name: totalstock-db
    databaseName: totalstock
    user: totalstock
    plan: free
    region: oregon
    postgresMajorVersion: "17"
